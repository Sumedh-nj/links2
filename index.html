<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EEN Year 2 Links</title>
  <link rel="icon" type="image/png" href="sustainability.png">
  <script>
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="games.css">
  <style>
    .layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    /* video columns removed */

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
        align-items: center;
      }
      .video-column {
        width: 100%;
        flex-direction: row;
        justify-content: center;
        margin: 0; /* reset margins for mobile */
      }
      .video-box {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <div id="games-section">
    <button id="open-games-modal">GAMES</button>
  </div>

  <!-- Games Modal Popup -->
  <div id="games-modal" class="modal">
    <div class="modal-content">
      <span class="close-button" id="close-games-modal">&times;</span>
      <h2>Choose a Game</h2>
      <div id="game-choices">
        <button class="game-choice-btn" data-game="flappybird">Flappy Cell</button>
        <button class="game-choice-btn" data-game="snake">Snake</button>
        <button class="game-choice-btn" data-game="energypong">Energy Pong</button>
        <button class="game-choice-btn" data-game="gridgambit">Grid Gambit</button>
      </div>
    </div>
  </div>
  <button class="button" id="theme-toggle">◐</button>

  <div class="layout">
    <!-- Main content -->
    <div class="main-content">
      <div class="container">
        <img src="image.png" alt="Avatar" class="avatar">
        <h1>BTECH Energy YEAR 2</h1>

        <div class="general"></div>
        <div class="links"></div>

        <div class="updates-layout">
          <div class="reel-panel left-reel">
            <h3>Random Clip</h3>
            <div class="reel-frame">
              <video id="local-clip-left" playsinline autoplay muted loop></video>
            </div>
          </div>

          <div class="updates">
            <h1>Updates</h1>
            <div class="box" id="timetable-box"><h2>Timetable</h2></div>
            <div class="box" id="assignments-box"><h2>Assignments</h2></div>
            <div class="box" id="quizzes-box"><h2>Quizzes</h2></div>
          </div>

          <div class="reel-panel right-reel">
            <h3>Random Clip</h3>
            <div class="reel-frame">
              <video id="local-clip-right" playsinline autoplay muted loop></video>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Video elements and mp4 autoplay removed -->

  <script src="scripts.js"></script>
  <script src="gamesscript.js"></script>

</body>
</html>
